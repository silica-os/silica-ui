name: silica_ui
description: The Silica design system for Flutter. Interface font (Inter, OFL), glass and Liquid Glass composed by Ossido.
# Distributed with git tags (vX.Y.Z) until the name is verified on pub.dev.
publish_to: none
version: 0.38.0
repository: https://github.com/silica-os/silica-ui

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    - shaders/glass_lens.frag
    - shaders/glass_edge.frag
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-Black.ttf
          weight: 900
    - family: SilicaSymbols
      fonts:
        - asset: fonts/SilicaSymbols-Regular.otf
    - family: SilicaSymbolsLight
      fonts:
        - asset: fonts/SilicaSymbols-Light.otf
    - family: SilicaSymbolsSemibold
      fonts:
        - asset: fonts/SilicaSymbols-Semibold.otf
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
